<script>

function paraMinutos(hora){
    const [h,m] = hora.split(':').map(Number);
    return h * 60 + m;
}

function paraHora(min){
    min = ((min % 1440) + 1440) % 1440;

    const h = Math.floor(min / 60)
        .toString()
        .padStart(2,'0');

    const m = (min % 60)
        .toString()
        .padStart(2,'0');

    return `${h}:${m}`;
}

function calcular(){

    const jornada = 504;
    const intervaloPadrao = 60;
    const heMax = 96;

    const entrada =
        paraMinutos(
            document.getElementById('entrada').value
        );

    const saidaAlmoco =
        paraMinutos(
            document.getElementById('saidaAlmoco').value
        );

    const retornoAlmoco =
        paraMinutos(
            document.getElementById('retornoAlmoco').value
        );

    const intervalo =
        retornoAlmoco - saidaAlmoco;

    const excesso =
        Math.max(
            0,
            intervalo - intervaloPadrao
        );

    const normal =
        entrada +
        jornada +
        intervaloPadrao +
        excesso;

    const he =
        normal +
        heMax;

    const heIntervalo =
        he +
        excesso;

    document.getElementById('resultado').innerHTML = `

        <div class="card normal">

            <div class="titulo">
                ✅ Saída Normal
            </div>

            <div class="valor">
                ${paraHora(normal)}
            </div>

            ${excesso > 0 ? `
                <div class="obs">
                    Incluído excesso de ${excesso} min no cálculo.
                </div>
            ` : ''}

        </div>

        <div class="card he">

            <div class="titulo">
                🔵 HE Máxima
            </div>

            <div class="valor">
                ${paraHora(he)}
            </div>

        </div>

        <div class="card total">

            <div class="titulo">
                🟠 HE + Excesso
            </div>

            <div class="valor">
                ${paraHora(heIntervalo)}
            </div>

        </div>

        <div class="card intervalo">

            <div class="titulo">
                ⏳ Intervalo Real
            </div>

            <div class="valor">
                ${intervalo} min
            </div>

            <div class="obs">
                Excesso: ${excesso} min
            </div>

        </div>

    `;

}

function limpar(){

    document.getElementById('entrada').value = '07:00';

    document.getElementById('saidaAlmoco').value = '12:00';

    document.getElementById('retornoAlmoco').value = '13:00';

    document.getElementById('resultado').innerHTML = '';

}

</script>
