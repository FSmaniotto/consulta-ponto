<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Jornada</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:#0f172a;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:520px;
    margin:auto;
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.header{
    background:linear-gradient(135deg,#2563eb,#06b6d4);
    color:white;
    padding:24px;
    text-align:center;
}

.header h1{
    font-size:30px;
    margin-bottom:8px;
}

.header p{
    opacity:.95;
}

.content{
    padding:24px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:700;
    font-size:18px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:2px solid #cbd5e1;
    border-radius:14px;
    font-size:18px;
}

button{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
}

.btn-calcular{
    background:#16a34a;
    color:white;
}

.btn-limpar{
    margin-top:10px;
    background:#e2e8f0;
}

.card{
    margin-top:18px;
    color:white;
    padding:20px;
    border-radius:18px;
}

.normal{
    background:#22c55e;
}

.he{
    background:#2563eb;
}

.total{
    background:#f59e0b;
}

.intervalo{
    background:#ef4444;
}

.titulo{
    font-size:22px;
    font-weight:700;
}

.valor{
    font-size:52px;
    font-weight:800;
    margin-top:12px;
}

.obs{
    margin-top:8px;
    font-size:14px;
    opacity:.95;
}

footer{
    text-align:center;
    padding:20px;
    color:#64748b;
    font-size:12px;
}
</style>

</head>
<body>

<div class="container">

    <div class="header">
        <h1>⏱️ Consulta de Jornada</h1>
        <p>Cálculo automático de saída</p>
    </div>

    <div class="content">

        <label>Entrada</label>
        <input type="time" id="entrada" value="07:00">

        <label>Saída para almoço</label>
        <input type="time" id="saidaAlmoco" value="12:00">

        <label>Retorno do almoço</label>
        <input type="time" id="retornoAlmoco" value="13:00">

        <label>Hora Extra Desejada</label>
        <input
            type="time"
            id="heDesejada"
            value="00:00"
            min="00:00"
            max="01:36"
        >

        <button class="btn-calcular" onclick="calcular()">
            CALCULAR SAÍDA
        </button>

        <button class="btn-limpar" onclick="limpar()">
            Limpar Dados
        </button>

        <div id="resultado"></div>

    </div>

    <footer>
       Consulta de Jornada • Versão 3.1
Criado por FSmaniotto
    </footer>

</div>

<script>

function paraMinutos(hora){
    const [h,m] = hora.split(':').map(Number);
    return h * 60 + m;
}

function paraHora(min){
    min = ((min % 1440) + 1440) % 1440;

    const h = Math.floor(min / 60)
        .toString()
        .padStart(2,'0');

    const m = (min % 60)
        .toString()
        .padStart(2,'0');

    return `${h}:${m}`;
}

function calcular(){

    const jornada = 504; // 8h24
    const intervaloPadrao = 60; // 1h

    const entrada =
        paraMinutos(
            document.getElementById('entrada').value
        );

    const saidaAlmoco =
        paraMinutos(
            document.getElementById('saidaAlmoco').value
        );

    const retornoAlmoco =
        paraMinutos(
            document.getElementById('retornoAlmoco').value
        );

    const heDesejada =
        paraMinutos(
            document.getElementById('heDesejada').value
        );

    const heLimitada =
        Math.min(
            heDesejada,
            96
        );

    const intervalo =
        retornoAlmoco - saidaAlmoco;

    const excesso =
        Math.max(
            0,
            intervalo - intervaloPadrao
        );

    /* Saída normal já considera excesso acima de 1h */

    const normal =
        entrada +
        jornada +
        intervaloPadrao +
        excesso;

    const saidaComHE =
        normal +
        heLimitada;

    const heMaisExcesso =
        saidaComHE +
        excesso;

    document.getElementById('resultado').innerHTML = `

        <div class="card normal">

            <div class="titulo">
                ✅ Saída Normal
            </div>

            <div class="valor">
                ${paraHora(normal)}
            </div>

            ${
                excesso > 0
                ? `
                <div class="obs">
                    Excesso de intervalo incluído: ${excesso} min
                </div>
                `
                : ''
            }

        </div>

        <div class="card he">

            <div class="titulo">
                🔵 Saída com HE
            </div>

            <div class="valor">
                ${paraHora(saidaComHE)}
            </div>

            <div class="obs">
                HE escolhida: ${document.getElementById('heDesejada').value}
            </div>

        </div>

        <div class="card total">

            <div class="titulo">
                🟠 HE + Excesso
            </div>

            <div class="valor">
                ${paraHora(heMaisExcesso)}
            </div>

        </div>

        <div class="card intervalo">

            <div class="titulo">
                ⏳ Intervalo Real
            </div>

            <div class="valor">
                ${intervalo} min
            </div>

            <div class="obs">
                Excesso: ${excesso} min
            </div>

        </div>

    `;
}

function limpar(){

    document.getElementById('entrada').value =
        '07:00';

    document.getElementById('saidaAlmoco').value =
        '12:00';

    document.getElementById('retornoAlmoco').value =
        '13:00';

    document.getElementById('heDesejada').value =
        '00:00';

    document.getElementById('resultado').innerHTML =
        '';

}

</script>

</body>
</html>
