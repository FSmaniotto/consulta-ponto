<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Jornada v5.1</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f1f5f9;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:550px;
    margin:auto;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.header{
    background:linear-gradient(135deg,#b8860b,#ffd700);
    color:white;
    text-align:center;
    padding:24px;
}

.header h1{
    font-size:30px;
    margin-bottom:8px;
}

.header p{
    opacity:.95;
}

.content{
    padding:24px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:700;
    font-size:16px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:16px;
    border:2px solid #cbd5e1;
    border-radius:18px;
    font-size:17px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

button{
    width:100%;
    border:none;
    border-radius:18px;
    padding:14px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

.btn-calcular{
    background:linear-gradient(135deg,#16a34a,#22c55e);
    color:white;
}

.btn-limpar{
    margin-top:10px;
    background:#e2e8f0;
}

.card{
    margin-top:15px;
    padding:18px;
    color:white;
    border-radius:18px;
}

.normal{
    background:#16a34a;
}

.he{
    background:#2563eb;
}

.total{
    background:#f59e0b;
}

.limite{
    background:#7c3aed;
}

.intervalo{
    background:#ef4444;
}

.duplo{
    display:flex;
    gap:12px;
    margin-top:15px;
}

.duplo .card{
    flex:1;
    margin-top:0;
}

.titulo{
    font-size:20px;
    font-weight:700;
}

.valor{
    margin-top:10px;
    font-size:46px;
    font-weight:800;
}

.duplo .valor{
    font-size:32px;
}

.obs{
    margin-top:8px;
    font-size:14px;
}

.alerta{
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    color:white;
    text-align:center;
    font-weight:700;
}

.alerta-aviso{
    background:#ea580c;
}

.alerta-critico{
    background:#dc2626;
}

footer{
    text-align:center;
    padding:20px;
    color:#64748b;
    font-size:12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⏱️ Consulta de ponto</h1>
        <p>Controle rápido de jornada e horas extras</p>
    </div>

    <div class="content">

        <label>Entrada</label>
        <input type="time" id="entrada" value="07:00">

        <label>Saída para almoço</label>
        <input type="time" id="saidaAlmoco" value="12:00">

        <label>Retorno do almoço</label>
        <input type="time" id="retornoAlmoco" value="13:00">

        <label>HE Planejada</label>
        <input type="time" id="heDesejada" value="00:00">

        <button class="btn-calcular" onclick="calcular()">
            CALCULAR SAÍDA
        </button>

        <button class="btn-limpar" onclick="limpar()">
            Limpar Dados
        </button>

        <div id="resultado"></div>

    </div>

    <footer>
        Consulta de Jornada • Versão 5.1<br>
        © FSmaniotto
    </footer>

</div>

<script>

function paraMinutos(hora){
    const [h,m] = hora.split(':').map(Number);
    return h * 60 + m;
}

function paraHora(minutos){

    minutos = ((minutos % 1440) + 1440) % 1440;

    const h = Math.floor(minutos / 60)
        .toString()
        .padStart(2,'0');

    const m = (minutos % 60)
        .toString()
        .padStart(2,'0');

    return `${h}:${m}`;
}

function calcular(){

    const entradaTxt =
        document.getElementById('entrada').value;

    const saidaTxt =
        document.getElementById('saidaAlmoco').value;

    const retornoTxt =
        document.getElementById('retornoAlmoco').value;

    const heTxt =
        document.getElementById('heDesejada').value;

    if(!entradaTxt || !saidaTxt || !retornoTxt || !heTxt){
        alert('Preencha todos os horários.');
        return;
    }

    const entrada =
        paraMinutos(entradaTxt);

    const saidaAlmoco =
        paraMinutos(saidaTxt);

    const retornoAlmoco =
        paraMinutos(retornoTxt);

    const heDesejada =
        paraMinutos(heTxt);

    if(saidaAlmoco <= entrada){
        alert('A saída para almoço deve ser posterior à entrada.');
        return;
    }

    if(retornoAlmoco <= saidaAlmoco){
        alert('O retorno do almoço deve ser posterior à saída para almoço.');
        return;
    }

    const intervalo =
        retornoAlmoco - saidaAlmoco;

    if(intervalo < 60){
        alert('O intervalo mínimo é de 1 hora.');
        return;
    }

    if(heDesejada > 96){
        alert('A HE máxima permitida é 01:36.');
        return;
    }

    const excesso =
        Math.max(0, intervalo - 60);

    const jornada = 504;

    const saidaNormal =
        entrada +
        jornada +
        60 +
        excesso;

    const saidaComHE =
        saidaNormal +
        heDesejada;

    const heMaisExcesso =
        saidaComHE +
        excesso;

    const limiteSemIntervalo =
        entrada + 360;

    const agora = new Date();

    const horaAtual =
        (agora.getHours() * 60) +
        agora.getMinutes();

    const restante =
        limiteSemIntervalo - horaAtual;

let alerta = '';

    if(restante <= 0){

        alerta = `
            <div class="alerta alerta-critico">
                🚨 LIMITE DE 6 HORAS SEM INTERVALO ATINGIDO
            </div>
        `;

    }else if(restante <= 30){

        alerta = `
            <div class="alerta alerta-aviso">
                ⚠️ Faltam apenas ${restante} minutos para atingir o limite de 6 horas sem intervalo.
            </div>
        `;
    }
    document.getElementById('resultado').innerHTML = `

        ${alerta}

        <div class="card normal">

            <div class="titulo">
                ✅ Saída Normal
            </div>

            <div class="valor">
                ${paraHora(saidaNormal)}
            </div>

            ${
                excesso > 0
                ? `<div class="obs">
                    Excesso incluído: ${excesso} min
                   </div>`
                : ''
            }

        </div>

        ${heDesejada > 0 ? `

        <div class="card he">

            <div class="titulo">
                🔵 Saída com HE
            </div>

            <div class="valor">
                ${paraHora(saidaComHE)}
            </div>

            <div class="obs">
                HE planejada: ${heTxt}
            </div>

        </div>

        <div class="card total">

            <div class="titulo">
                🟠 HE + Excesso
            </div>

            <div class="valor">
                ${paraHora(heMaisExcesso)}
            </div>

        </div>

        ` : ''}

        <div class="duplo">

            <div class="card limite">

                <div class="titulo">
                    🟣 Limite
                </div>

                <div class="valor">
                    ${paraHora(limiteSemIntervalo)}
                </div>

                ${
                    restante > 0
                    ? `<div class="obs">
                        ${Math.floor(restante/60)}h ${restante%60}min restantes
                       </div>`
                    : `<div class="obs">
                        Limite atingido
                       </div>`
                }

            </div>

            <div class="card intervalo">

                <div class="titulo">
                    ⏳ Intervalo
                </div>

                <div class="valor">
                    ${intervalo} min
                </div>

                <div class="obs">
                    Excesso: ${excesso} min
                </div>

            </div>

        </div>

    `;
}

function limpar(){

    document.getElementById('entrada').value='07:00';
    document.getElementById('saidaAlmoco').value='12:00';
    document.getElementById('retornoAlmoco').value='13:00';
    document.getElementById('heDesejada').value='00:00';
    document.getElementById('resultado').innerHTML='';

}

</script>

</body>
</html>
