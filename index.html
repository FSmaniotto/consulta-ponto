<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Jornada</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Segoe UI,Arial,sans-serif;
  background:#0f172a;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:520px;
  margin:auto;
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.header{
  padding:24px;
  background:linear-gradient(135deg,#1d4ed8,#06b6d4);
  color:white;
  text-align:center;
}

.header h1{
  font-size:30px;
}

.header p{
  margin-top:8px;
  opacity:.9;
}

.content{
  padding:24px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:700;
  color:#334155;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:16px;
  border-radius:12px;
  border:2px solid #cbd5e1;
  font-size:16px;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.calcular{
  background:#16a34a;
  color:white;
}

.limpar{
  margin-top:10px;
  background:#e2e8f0;
}

.card{
  margin-top:15px;
  color:white;
  padding:18px;
  border-radius:16px;
}

.normal{
  background:#22c55e;
}

.he{
  background:#2563eb;
}

.total{
  background:#f59e0b;
}

.excesso{
  background:#ef4444;
}

.valor{
  font-size:36px;
  font-weight:800;
  margin-top:6px;
}

.info{
  margin-top:6px;
  opacity:.9;
}

footer{
  text-align:center;
  padding:20px;
  color:#64748b;
  font-size:12px;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>⏱️ Consulta de Jornada</h1>
    <p>Cálculo automático de saída</p>
  </div>

  <div class="content">

    <label>Entrada</label>
    <input type="time" id="entrada" value="07:30">

    <label>Saída para almoço</label>
    <input type="time" id="saidaAlmoco" value="12:00">

    <label>Retorno do almoço</label>
    <input type="time" id="retornoAlmoco" value="13:00">

    <button class="calcular" onclick="calcular()">
      CALCULAR SAÍDA
    </button>

    <button class="limpar" onclick="limpar()">
      Limpar Dados
    </button>

    <div id="resultado"></div>

  </div>

  <footer>
    Consulta Ponto • Versão 2.0
  </footer>

</div>

<script>

function paraMinutos(hora){
  const [h,m]=hora.split(':').map(Number);
  return h*60+m;
}

function paraHora(min){
  min=((min%1440)+1440)%1440;

  const h=Math.floor(min/60)
  .toString()
  .padStart(2,'0');

  const m=(min%60)
  .toString()
  .padStart(2,'0');

  return `${h}:${m}`;
}

function calcular(){

  const jornada=504;
  const intervaloPadrao=60;
  const heMax=96;

  const entrada=
    paraMinutos(
      document.getElementById('entrada').value
    );

  const saidaAlmoco=
    paraMinutos(
      document.getElementById('saidaAlmoco').value
    );

  const retornoAlmoco=
    paraMinutos(
      document.getElementById('retornoAlmoco').value
    );

  const intervalo=
    retornoAlmoco-saidaAlmoco;

  const excesso=
    Math.max(
      0,
      intervalo-intervaloPadrao
    );

  const normal=
    entrada+jornada+intervaloPadrao;

  const he=
    normal+heMax;

  const heIntervalo=
    he+excesso;

  document.getElementById('resultado')
  .innerHTML=`
  
  <div class="card normal">
    <div>✅ Saída Normal</div>
    <div class="valor">${paraHora(normal)}</div>
  </div>

  <div class="card he">
    <div>🔵 HE Máxima</div>
    <div class="valor">${paraHora(he)}</div>
  </div>

  <div class="card total">
    <div>🟠 HE + Excesso</div>
    <div class="valor">${paraHora(heIntervalo)}</div>
  </div>

  <div class="card excesso">
    <div>⏳ Intervalo Real</div>
    <div class="valor">${intervalo} min</div>
    <div class="info">Excesso: ${excesso} min</div>
  </div>

  `;
}

function limpar(){

  document.getElementById('entrada').value='07:30';
  document.getElementById('saidaAlmoco').value='12:00';
  document.getElementById('retornoAlmoco').value='13:00';

  document.getElementById('resultado')
  .innerHTML='';
}

</script>

</body>
</html>
