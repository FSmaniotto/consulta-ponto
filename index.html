<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta Ponto</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.header{
    background:linear-gradient(90deg,#1d4ed8,#06b6d4);
    color:white;
    padding:20px;
}

.header h1{
    margin:0;
}

.content{
    padding:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    box-sizing:border-box;
    border:2px solid #cbd5e1;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.btn{
    background:#16a34a;
    color:white;
}

.btn-clear{
    background:#e2e8f0;
}

.card{
    margin-top:12px;
    padding:15px;
    border-radius:12px;
    color:white;
}

.green{background:#22c55e;}
.blue{background:#2563eb;}
.orange{background:#f59e0b;}
.red{background:#ef4444;}

.result{
    font-size:32px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>⏱️ Consulta Ponto</h1>
        <p>Consulta rápida de jornada</p>
    </div>

    <div class="content">

        <label>Entrada</label>
        <input type="time" id="entrada" value="07:30">

        <label>Intervalo</label>
        <input type="time" id="intervalo" value="01:00">

        <button class="btn" onclick="calcular()">CALCULAR SAÍDA</button>

        <button class="btn-clear" onclick="limpar()">Limpar dados</button>

        <div id="resultado"></div>

    </div>
</div>

<script>
function paraMinutos(hora){
    const partes = hora.split(':');
    return parseInt(partes[0])*60 + parseInt(partes[1]);
}

function paraHora(min){
    min = ((min % 1440) + 1440) % 1440;
    const h = String(Math.floor(min/60)).padStart(2,'0');
    const m = String(min%60).padStart(2,'0');
    return h + ':' + m;
}

function calcular(){

    const jornada = 504;
    const intervaloPadrao = 60;
    const heMax = 96;

    const entrada = paraMinutos(document.getElementById('entrada').value);
    const intervalo = paraMinutos(document.getElementById('intervalo').value);

    const excesso = Math.max(0, intervalo - intervaloPadrao);

    const normal = entrada + jornada + intervaloPadrao;
    const he = normal + heMax;
    const heIntervalo = he + excesso;

    document.getElementById('resultado').innerHTML = `
        <div class="card green">
            <small>Saída Normal</small>
            <div class="result">${paraHora(normal)}</div>
        </div>

        <div class="card blue">
            <small>Saída com HE Máxima</small>
            <div class="result">${paraHora(he)}</div>
        </div>

        <div class="card orange">
            <small>HE + Excesso Intervalo</small>
            <div class="result">${paraHora(heIntervalo)}</div>
        </div>

        ${excesso > 0 ? `
        <div class="card red">
            <small>Excesso de intervalo</small>
            <div class="result">${excesso} min</div>
        </div>` : ''}
    `;
}

function limpar(){
    document.getElementById('entrada').value='07:30';
    document.getElementById('intervalo').value='01:00';
    document.getElementById('resultado').innerHTML='';
}
</script>

</body>
</html>
